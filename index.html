    const rp=e.target.closest('[data-act="resetprog"]');if(rp){if(rp.dataset.ok){PROG={};saveProg();exModal();toast('Progression effacée.');}else{rp.dataset.ok='1';rp.textContent='Confirmer l’effacement ?';rp.classList.add('danger');}return;}
    const x=e.target.closest('[data-exo]');if(x){const ex=EXOS.find(o=>o.k===x.dataset.exo);closeModal();loadExo(ex);toast(`Exercice « ${ex.t} » : suis les étapes de la consigne.`);return;}
    const b=e.target.closest('[data-ex]');if(!b)return;setMode('design');snap();buildExample(b.dataset.ex);closeModal();sel=null;$('#helpChk').checked=S.help;syncLevel();render();renderProps();save();fitView();};
};
$('#bExport').onclick=()=>{rec('export');
  const json=JSON.stringify(S,null,1);
  openModal(`<div class="mhead"><h2>Exporter le schéma</h2><button class="wbtn wx" data-close type="button" aria-label="Fermer">×</button></div><p class="small muted" style="margin:0">Copie ce texte et colle-le dans un fichier (par exemple <code class="ad">reseau-salle101.json</code>) ou dans l’ENT pour tes élèves. Pour le recharger : Importer.</p><textarea class="inp" id="expTxt" readonly style="height:260px">${esc(json)}</textarea><div class="row"><button class="btn primary" id="cpy" type="button">Copier le texte</button><span class="small muted">${S.devices.length} appareils · ${S.cables.length} câbles · ${S.zones.length} salles</span></div>`);
  $('#mbox').onclick=e=>{if(e.target.closest('[data-close]'))closeModal();};
  $('#cpy').onclick=()=>{const ta=$('#expTxt');const ok=()=>toast('Schéma copié dans le presse-papiers.');try{navigator.clipboard.writeText(json).then(ok,()=>{ta.focus();ta.select();toast('Texte sélectionné : fais Ctrl + C pour copier.');});}catch(_){ta.focus();ta.select();toast('Texte sélectionné : fais Ctrl + C pour copier.');}};
};
$('#bImport').onclick=()=>{
  openModal(`<div class="mhead"><h2>Importer un schéma</h2><button class="wbtn wx" data-close type="button" aria-label="Fermer">×</button></div><div class="field"><label for="impFile">Choisir un fichier .json</label><input type="file" id="impFile" accept=".json,.txt,application/json"></div><div class="field"><label for="impTxt">ou coller le texte exporté</label><textarea class="inp" id="impTxt" style="height:180px" placeholder='{"devices":[…]}'></textarea></div><div class="row"><button class="btn primary" id="impGo" type="button">Charger ce schéma</button><span class="small muted" id="impMsg"></span></div>`);
  $('#mbox').onclick=e=>{if(e.target.closest('[data-close]'))closeModal();};
  $('#impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#impTxt').value=r.result;};r.readAsText(f);};
  $('#impGo').onclick=()=>{
    try{const o=JSON.parse($('#impTxt').value);if(!o||!Array.isArray(o.devices)||!Array.isArray(o.cables))throw 0;
      setMode('design');snap();S=Object.assign(blank(),o);S.zones=S.zones||[];S.nextId=Math.max(S.nextId||1,...S.devices.map(d=>d.id+1),...S.cables.map(c=>c.id+1),...S.zones.map(z=>z.id+1));
      $('#helpChk').checked=S.help!==false;syncLevel();closeModal();sel=null;render();renderProps();save();fitView();toast('Schéma chargé.');
    }catch(_){$('#impMsg').textContent='Ce texte n’est pas un schéma valide.';}
  };
};

/* ============================================================
   Exemples
   ============================================================ */
function buildExample(k){
  const prevLv=lv();S=blank();S.level=prevLv;
  const host=(t,x,y,ip,gw,extra)=>newDevice(t,x,y,Object.assign({ip,gw:gw||''},extra||{}));
  const zone=(name,x,y,w,h,color)=>S.zones.push({id:S.nextId++,name,x,y,w,h,color});
  const link=(a,b)=>connect(a,b,true);
  if(k==='salle'){
    zone('Salle 101',0,0,600,520,'bleu');
    const sw=newDevice('switch',300,232);
    const a=host('pc',104,96,'192.168.0.11'),b=host('pc',496,96,'192.168.0.12'),c=host('laptop',104,384,'192.168.0.13');
    const pi=host('rpi',496,384,'192.168.0.10');pi.web.on=true;pi.web.page='Site du club robotique\nBienvenue sur le serveur Raspberry Pi de la salle 101.\nProchaine séance : mercredi à 13 h.';
    const pr=host('printer',300,424,'192.168.0.50');
    [a,b,c,pi,pr].forEach(x=>link(x,sw));
  }else if(k==='deux'||k==='panne'){
    buildDeux(H(),k==='panne');S.level=Math.max(prevLv,1);if(k==='panne')S.help=false;
  }
}

/* ============================================================
   Démarrage
   ============================================================ */
/* ============================================================
   Passerelle : point d’accès unique aux données de NetSim.
   Utilisé par la connexion à la Centrale (plus bas) et par
   outils/verifier-descripteur.html. Contrat : PASSERELLE.md
   et centrale.json (descripteur de l’atelier).
   ============================================================ */
const NETSIM_VERSION='1.6.0';
/* Capacités du référentiel de la Centrale (passerelle/competences.json) travaillées par chaque exercice.
   Recopiées dans centrale.json (activites.liste[].competences) : outils/verifier-descripteur.html compare. */
const COMP_EXO={
  'e5-1':['SFC15.5.1'],'e5-2':['SFC15.5.1'],'e5-3':['SFC15.5.2'],'e5-4':['SFC15.5.2'],'e5-5':['SFC15.5.2'],'e5-6':['SFC15.5.2'],'e5-7':['SFC15.5.1'],
  'e4-1':['SFC15.4.1','SFC15.4.3'],'e4-2':['SFC15.4.2'],'e4-3':['SFC15.4.3'],'e4-4':['SFC15.4.3'],'e4-5':['SFC15.4.2'],'e4-6':['SFC15.4.1','CCRI17.4.1'],
  'e3-1':['SFC15.3.2'],'e3-2':['SFC15.3.2','CCRI22.3.1'],'e3-3':['SFC15.3.2'],'e3-4':['SFC15.3.2'],'e3-5':['SFC15.3.1']
};
window.NetSim=Object.freeze({
  app:'netsim',
  version:NETSIM_VERSION,
  descripteur:'centrale.json',
  /** Activités déclarées à la Centrale (colonnes du tableau de suivi). */
  activites:()=>EXOS.map(x=>({id:x.k,titre:x.t,groupe:CLASSES[x.c].t+' · '+LV_NAMES[CLASSES[x.c].lv],total:x.steps.length,competences:COMP_EXO[x.k]||[]})),
  /** Catalogue détaillé des exercices. */
  catalogue:()=>EXOS.map(x=>({id:x.k,classe:x.c,niveau:CLASSES[x.c].lv,categorie:x.cat,categorie_titre:catName(x.c,x.cat),titre:x.t,resume:x.p,duree:x.dur,etapes:x.steps.length,etapes_auto:x.steps.filter(st=>st.c).length,questions:x.q||[],alertes:x.help!==false})),
  /** Progression d’un exercice au format de la Centrale, ou null. */
  progression:k=>{const p=PROG[k],def=EXOS.find(e=>e.k===k);if(!p||!def)return null;return {titre:def.t,faites:Math.min(p.best||0,def.steps.length),total:def.steps.length,statut:p.done?'termine':'commence'};},
  /** Constats de compétences de l’exercice en cours s’il vient d’être terminé (une seule fois), sinon []. */
  constats:k=>{const x=S.exo,def=EXOS.find(e=>e.k===k);if(!x||x.k!==k||!def||(x.cur||0)<def.steps.length||x.constate)return [];
    x.constate=true;const ind=(x.ind||[]).length,saut=x.saut||0,auto=def.steps.filter(st=>st.c).length;
    return (COMP_EXO[k]||[]).map(competence=>({competence,reussi:saut*2<=auto,indices:ind+saut,essais:x.essai||1,
      preuve:`Exercice « ${def.t} » : ${def.steps.length} étapes, ${ind} indice${ind>1?'s':''} ouvert${ind>1?'s':''}, ${saut} étape${saut>1?'s':''} passée${saut>1?'s':''}`}));},
  /** Fusionne une progression reçue de la Centrale (le meilleur est gardé). */
  fusionnerProgression:serveur=>{Object.entries(serveur||{}).forEach(([k,p])=>{if(!EXOS.some(e=>e.k===k))return;const l=PROG[k]||{};l.started=true;l.n=p.total||l.n;l.best=Math.max(l.best||0,p.faites||0);if(p.statut==='termine')l.done=true;PROG[k]=l;});saveProg();},
  /** Données enregistrées sous chaque clé (voir centrale.json → donnees). */
  donnees:()=>({schema:JSON.parse(JSON.stringify(S)),decouvertes:[...(PROG.__seen||[])]}),
  /** Vérifie qu’un objet est un schéma NetSim chargeable. */
  estSchema:o=>!!(o&&Array.isArray(o.devices)&&Array.isArray(o.cables))
});

(function init(){
  let loaded=false;
  try{const raw=localStorage.getItem(KEY)||localStorage.getItem('atelier-reseau-v2')||localStorage.getItem('atelier-reseau-v1');if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.devices)&&Array.isArray(o.cables)){S=Object.assign(blank(),o);S.zones=S.zones||[];loaded=true;}}}catch(_){}
  if(!loaded)buildExample('deux');
  $('#helpChk').checked=S.help!==false;
  applyPrefs();syncLevel();updPause();placeAll();setHint();render();renderProps();fillDevSelect();renderFrames();
  requestAnimationFrame(fitView);
  window.addEventListener('resize',()=>{});
})();
</script>

<!-- ============================================================
     Centrale élèves (facultatif) : connexion avec le code personnel,
     sauvegarde du schéma sur le serveur et suivi de la progression
     des exercices par l'enseignant. Sans réseau ou sans connexion,
     NetSim fonctionne exactement comme avant (navigateur seul).
     ============================================================ -->
<script>
(function(){
  'use strict';
  const SERVEUR=window.CENTRALE_URL||'https://technoversailles.alwaysdata.net/';
  const avecJeton=/(^|[#&])centrale=/.test(location.hash);
  let pret=false,bouton=null,fenetre=null;

  const js=document.createElement('script');
  js.src=SERVEUR+'js/centrale-client.js';
  js.onload=demarrer;              // serveur injoignable : rien ne change pour NetSim
  document.head.appendChild(js);

  function demarrer(){
    if(!window.Centrale)return;
    Centrale.init({
      api:SERVEUR+'api/',
      app:'netsim',
      // Liste des exercices : colonnes du tableau de suivi de l'enseignant
      activites:NetSim.activites(),
      surDeconnexion:()=>{pret=false;majBouton();toast('Session terminée : reconnecte-toi pour enregistrer ton travail.');}
    });
    creerBouton();
    if(avecJeton||Centrale.connecte())Centrale.afficherConnexion(corpsFenetre(),{onConnecte:connecte});
  }

  /* ---------- Bouton dans la barre du haut ---------- */
  function creerBouton(){
    const ref=$('#bSet')&&$('#bSet').closest('.menuwrap');
    bouton=document.createElement('button');
    bouton.className='btn flat';bouton.type='button';bouton.id='bCentrale';
    bouton.onclick=()=>{
      if(Centrale.connecte()){
        const s=Centrale.session();
        if(confirm(`Connecté : ${s.classe} · élève ${s.eleve}.\nTon travail est enregistré automatiquement.\n\nSe déconnecter ?`)){
          Centrale.deconnexion();pret=false;majBouton();toast('Déconnecté. NetSim enregistre de nouveau dans ce navigateur seulement.');
        }
        return;
      }
      ouvrirFenetre();
    };
    if(ref)ref.parentNode.insertBefore(bouton,ref);else document.querySelector('.topbar').appendChild(bouton);
    majBouton();
  }
  function majBouton(){
    if(!bouton)return;
    const s=Centrale.connecte()&&Centrale.session();
    bouton.innerHTML=s
      ?`<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>${esc(s.classe)} · ${esc(s.eleve)}</span>`
      :`<svg class="i" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></svg><span>Mon code</span>`;
    bouton.title=s?'Ton travail est enregistré sur le serveur de la classe':'Se connecter avec son code pour enregistrer son travail et sa progression';
  }

  /* ---------- Fenêtre de connexion ---------- */
  function corpsFenetre(){
    if(fenetre)return fenetre.querySelector('.cz-corps');
    fenetre=document.createElement('div');
    fenetre.hidden=true;
    fenetre.id='centraleFenetre';
    fenetre.style.cssText='position:fixed;inset:0;z-index:1000;place-items:center;background:rgba(0,0,0,.35);padding:16px';
    fenetre.innerHTML='<div style="background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(420px,100%);box-shadow:0 10px 40px rgba(0,0,0,.25)">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><strong style="font-size:1.1rem">Connexion de la classe</strong>'
      +'<button type="button" class="btn flat" data-fermer aria-label="Fermer">✕</button></div>'
      +'<p style="margin:0 0 12px;color:var(--ink-3)">Avec ton code, ton schéma et tes exercices sont enregistrés et ton professeur voit ta progression.</p>'
      +'<div class="cz-corps"></div></div>';
    fenetre.addEventListener('click',e=>{if(e.target===fenetre||e.target.closest('[data-fermer]'))montrer(false);});
    document.body.appendChild(fenetre);
    return fenetre.querySelector('.cz-corps');
  }
  function montrer(oui){fenetre.hidden=!oui;fenetre.style.display=oui?'grid':'none';}
  function ouvrirFenetre(){
    const corps=corpsFenetre();
    montrer(true);
    Centrale.afficherConnexion(corps,{onConnecte:connecte});
  }

  /* ---------- Une fois connecté ---------- */
  async function connecte(infos){
    if(fenetre)montrer(false);
    majBouton();
    try{
      // 1. Progression : on garde le meilleur entre ce navigateur et le serveur
      const serveur=await Centrale.mesProgressions();
      NetSim.fusionnerProgression(serveur);
      Object.keys(PROG).forEach(k=>{
        if(k==='__seen')return;
        const l=PROG[k],p=serveur[k];
        if(!p||(l.best||0)>(p.faites||0)||(l.done&&p.statut!=='termine'))envoyerProgres(k);
      });
      const vus=await Centrale.charger('decouvertes',[]);
      PROG.__seen=[...new Set([...(PROG.__seen||[]),...(Array.isArray(vus)?vus:[])])];
      saveProg();
      // 2. Schéma : on reprend celui du serveur s'il existe, sinon on envoie celui de ce navigateur
      const schema=await Centrale.charger('schema',null);
      if(NetSim.estSchema(schema)){
        if(JSON.stringify(schema)!==JSON.stringify(S)){
          snap();                                   // l'ancien schéma reste accessible avec « Annuler »
          S=Object.assign(blank(),schema);S.zones=S.zones||[];
          sel=null;pendingCable=null;$('#helpChk').checked=S.help!==false;
          syncLevel();render();renderProps();if(typeof renderExo==='function')renderExo();fitView();
          try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}
        }
      }else{
        Centrale.sauver('schema',S);
      }
      pret=true;
      // 3. Exercice demandé depuis le portail (« Ouvrir » sur une activité) : on l'ouvre directement,
      //    sauf si l'élève est déjà dessus (il reprend alors là où il en était)
      const demande=Centrale.activiteDemandee();
      const exo=demande&&EXOS.find(x=>x.k===demande);
      if(exo&&!(S.exo&&S.exo.k===exo.k))loadExo(exo);
      toast(`Connecté : ${infos.classe} · élève ${infos.eleve}. Ton travail est enregistré automatiquement.`);
    }catch(e){
      toast('Connexion au serveur impossible : '+e.message);
    }
  }

  function envoyerProgres(k){
    const p=NetSim.progression(k);
    if(!p)return;
    const c=NetSim.constats(k);            // exercice terminé : constats de compétences pour la Centrale
    if(c.length){p.constats=c;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(_){}}
    Centrale.progression(k,p);
  }

  /* ---------- Appelés par NetSim ---------- */
  window.centraleTravail=()=>{if(pret&&Centrale.connecte())Centrale.sauver('schema',S);};
  window.centraleProgres=k=>{
    if(!pret||!Centrale.connecte())return;
    envoyerProgres(k);
    Centrale.sauver('decouvertes',PROG.__seen||[]);
  };
})();
</script>
