# Forge des communs numériques éducatifs : publie NetSim avec GitLab Pages
# (adresse affichée dans Déployer → Pages). Le dépôt y est copié depuis GitHub
# (script techno-publier.sh forge, ou le workflow miroirs.yml si configuré).
# NetSim est une page unique : aucune construction.
pages:
  stage: deploy
  image: alpine:3.20
  script:
    - mkdir -p public
    - cp -r index.html .nojekyll ateliers.json centrale.json PASSERELLE.md outils public/
    - test -f public/index.html || (echo "public/index.html manquant" && exit 1)
    - 'echo "Site : $CI_PAGES_URL"'
  pages: true
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
